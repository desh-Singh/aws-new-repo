<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Desh Singh Business Document Upload aws </title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fb;
      transition: background 0.3s, color 0.3s;
    }

    body.dark-mode {
      background: #0f172a;
      color: #e5e7eb;
    }

    body.dark-mode .card {
      background: #020617;
      color: #e5e7eb;
    }

    body.dark-mode .form-control {
      background: #020617;
      color: #e5e7eb;
      border-color: #334155;
    }

    .card {
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    }

    .required::after {
      content: " *";
      color: red;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">

      <!-- DARK MODE TOGGLE -->
      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-outline-secondary btn-sm" onclick="toggleDarkMode()">
          🌙 Toggle Dark Mode
        </button>
      </div>

      <!-- FLASH MESSAGE -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="card p-4">
        <h3 class="text-center mb-4">Desh Singh Business Document Upload</h3>

        <form
          action="/upload"
          method="POST"
          enctype="multipart/form-data"
          onsubmit="return handleSubmit(event)"
        >
        <!-- <div class="mb-3">
            <label class="form-label ">Sales Rep Name</label>
            <input type="text" name="sales_rep_name" class="form-control">
          </div> -->
          <!-- EMAIL -->
          <div class="mb-3">
            <label class="form-label required">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>

          <!-- PHONE -->
          <div class="mb-3">
            <label class="form-label required">Phone</label>
            <input type="text" name="phone" class="form-control" required>
          </div>

          <hr>

          <!-- FILE INPUTS -->
          <div class="mb-3">
            <label class="form-label required">Driving License</label>
            <input type="file" name="driving_license" class="form-control file-input" required>
          </div>

          <div class="mb-3">
            <label class="form-label required">Voided Check / Bank Letter</label>
            <input type="file" name="bank_doc" class="form-control file-input" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Tax Document</label>
            <input type="file" name="tax_doc" class="form-control file-input">
          </div>

          <div class="mb-4">
            <label class="form-label">Other Document</label>
            <input type="file" name="other_doc" class="form-control file-input">
          </div>

          <!-- PROGRESS BAR -->
          <div class="progress mb-3 d-none" id="progressContainer">
            <div
              class="progress-bar progress-bar-striped progress-bar-animated"
              id="progressBar"
              style="width: 0%"
            ></div>
          </div>

          <!-- SUBMIT -->
          <div class="d-grid">
            <button type="submit" id="submitBtn" class="btn btn-primary btn-lg">
              <span id="btnText">Submit Documents</span>
              <span id="loader" class="spinner-border spinner-border-sm ms-2 d-none"></span>
            </button>
          </div>

        </form>
      </div>

      <p class="text-center text-muted mt-3">
        Secure automated document processing
      </p>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const allowedTypes = ["application/pdf", "image/jpeg", "image/png"];

  // File type validation
  document.querySelectorAll(".file-input").forEach(input => {
    input.addEventListener("change", () => {
      if (input.files.length && !allowedTypes.includes(input.files[0].type)) {
        alert("Only PDF, JPG, and PNG files are allowed.");
        input.value = "";
      }
    });
  });

  function handleSubmit(e) {
    const btn = document.getElementById("submitBtn");
    const loader = document.getElementById("loader");
    const btnText = document.getElementById("btnText");
    const progress = document.getElementById("progressContainer");
    const bar = document.getElementById("progressBar");

    btn.disabled = true;
    loader.classList.remove("d-none");
    btnText.textContent = "Processing...";
    progress.classList.remove("d-none");

    // Fake progress animation (real progress needs AJAX)
    let percent = 0;
    const interval = setInterval(() => {
      percent += 10;
      bar.style.width = percent + "%";
      if (percent >= 100) clearInterval(interval);
    }, 300);

    return true;
  }

  function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
  }
</script>

</body>
</html>
